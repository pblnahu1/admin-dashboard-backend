name: CI

on:
  push:
    branches:
      - main
      - 'bun-migration'
  pull_request:
    branches:
      - main
      - 'bun-migration'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-deps-${{ runner.os }}-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: bun-deps-${{ runner.os }}-
      - name: Install dependencies
        run: bun install
      - name: Run lint
        run: bun run lint
      - name: Run typecheck
        run: bun run typecheck
      - name: Run tests
        run: bun run test --runInBand
      - name: Build production assets
        run: bun run build
